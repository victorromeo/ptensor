name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}${{ matrix.sanitize && ' + sanitizers' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            build_type: Release
          - compiler: clang
            build_type: Release
          - compiler: gcc
            build_type: Debug
            sanitize: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch googletest
        run: git submodule update --init --depth 1 extern/gtest
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang CXX=clang++
          fi
          EXTRA=""
          if [ "${{ matrix.sanitize }}" = "true" ]; then
            EXTRA="-DPTENSOR_SANITIZE=ON"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPACKAGE_TESTS=ON -DPACKAGE_TUTORIALS=ON $EXTRA
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --timeout 120
